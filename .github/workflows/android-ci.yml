name: android-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendored termux-x11 carries nested X.org submodules (xserver,
          # xkbcomp, pixman, ...) that :lorie's native build compiles.
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The repo carries gradle-wrapper.properties but no gradlew script
      # or wrapper jar (AI Studio export), so run the pinned Gradle
      # directly instead of the wrapper.
      # The repo carries gradle-wrapper.properties but no gradlew script or
      # wrapper jar (AI Studio export), and setup-gradle's provisioning
      # failed on the runner image's stale /usr/bin/gradle - install the
      # pinned Gradle directly instead.
      - name: Install Gradle 9.3.1
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      # Fixed debug signing key arrives via the ANDROID_DEBUG_KEYSTORE_B64
      # repo secret (never committed, never in chat) so every CI APK is an
      # upgrade-compatible install over the previous one.
      - name: Decode fixed debug keystore
        run: echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > debug.keystore
      # :lorie builds libXlorie.so from C source; bison generates the xkb
      # parser, the SDK cmake package provides ninja.
      - name: Install native build tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: aetherlinux-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
